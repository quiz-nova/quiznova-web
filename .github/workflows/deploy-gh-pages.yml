name: Deploy Web Client

on:
  push:
    branches: ["main", "develop", "staging"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to deploy to"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || (github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/staging' && 'staging' || 'development')) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Client
        run: |
          TARGET="${{ github.event_name == 'workflow_dispatch' && inputs.target_env || (github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/staging' && 'staging' || 'development')) }}"
          if [ "$TARGET" == "production" ]; then
            npm run build -- --base-href /
          elif [ "$TARGET" == "staging" ]; then
            npm run build:staging -- --base-href /
          else
            npm run build:dev -- --base-href /
          fi

      - name: SPA Routing Fix (Create 404.html)
        run: cp dist/quiznova-web/browser/index.html dist/quiznova-web/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/quiznova-web/browser
          branch: gh-pages
